# The bench's Supabase settings: the machine, the same for every trial.
# up.sh copies this beside the workspace's migrations; the workspace's own
# config.toml, if any, is not used (spec/bindings/supabase.md).
#
# Everything here is a test value for a local throwaway stack.

project_id = "bench-team-tasks"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

# Mailpit: the emailed codes land here (HTTP API on this port).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5310"
additional_redirect_urls = ["http://localhost:5310", "http://localhost:5310/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# High limits: the suite signs in many people quickly.
[auth.rate_limit]
email_sent = 10000
sms_sent = 30
anonymous_users = 30
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 10000

# Sign-in by an emailed 6-digit code. No passwords, no confirmation step.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Your sign-in code"
content_path = "./supabase/templates/code.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
