# cargo-nextest's settings (owner ruling 2026-11-01, board task
# `cut-test-time-by-building-and`). CI runs the suite with nextest, and
# `cargo nextest run -p <crate>` runs one crate the same way locally.
#
# nextest runs every test in a process of its own, and runs tests from many
# test files at once. Two things that held under `cargo test` do not:
#
# - A file-wide lock (`static SERIAL: Mutex`) holds only inside one process,
#   so it no longer keeps a file's tests one at a time.
# - A helper that seeds a shared database "once per test binary"
#   (`Fixture::reset_once`, a `static ONCE`) now seeds once per test. Each
#   seeding drops and rebuilds the schema while the file's other tests read
#   it. Several files share one database too (`ordo_conformance`,
#   `ordo_wide`, `ordo_gc_reads`), and cargo ran those files one at a time.
#
# Measured 2026-11-01: ordo-conformance run with nextest's default
# parallelism failed 49 of 359 tests this way; one at a time, all passed.
#
# The groups below cap how many of those tests run at once. A test in a
# group still runs beside tests outside it. Groups apply to every profile.

[test-groups]
# Files that hold a file-wide lock because each test boots a whole
# deployment, counts connections, or both. One group for all of them keeps
# what cargo gave: at most one such test at a time on the job's server.
serial-in-file = { max-threads = 1 }
# notes_app's tests each boot a deployment with a pool of 6 and its
# tenants' pools. Eight at once ran a 100-connection server out (notes_app
# agent, 2026-11-01); about 4 deployments at once is the safe figure. This
# group's 3 and serial-in-file's 1 make 4.
notes-app = { max-threads = 3 }
# Files that seed a shared, fixed-name database once per process.
seeded-once = { max-threads = 1 }
# Behaviour tests whose time lives in Postgres or in a loop no test clock
# reaches yet (owner ruling 2026-11-02, ask 3 on board task
# `time-sensitive-tests-fail-when-other-tests`). They run one at a time,
# and CI runs `group(timing-alone)` after the rest with nothing beside it.
# A test that moves to a test clock leaves this list.
timing-alone = { max-threads = 1 }

# Why each is here:
# - supervisor leadership and secevent claims: leadership is a Postgres
#   advisory lock, dialled over a fresh connection bounded by the tick.
# - deploy_apply, undo_space: they wait on a Postgres lock.
# - reseal, blob_gc, usage, routines: the supervisor's own clock
#   (`now_secs`) and its worker ticks run on real time, beside real
#   Postgres I/O. tokio's paused clock skips ahead while a query is in
#   flight and fires the connect timeout, so it cannot be used. A manual
#   clock for the supervisor is the seam still owed.
# - ordo-cli apply_wait: it boots a real ordo-host binary.
# This override comes first: a test takes the first group that matches.
[[profile.default.overrides]]
filter = '''
    (binary_id(ordo-host::supervisor) & (test(leadership_fails_over_between_two_supervisors) | test(/^secevent_.*_claims_its_own_schedule_once_per_period$/)))
  | (binary_id(ordo-host::deploy_apply) & test(the_lock_is_held_while_an_apply_is_running))
  | (binary_id(ordo-exec::undo_space) & test(a_lock_holds_this_space_s_row))
  | (binary_id(ordo-host::reseal) & test(a_wedged_pass_raises_the_stuck_gauge))
  | (binary_id(ordo-host::blob_gc) & test(/^the_sweep_runs_on_its_cadence/))
  | binary_id(ordo-host::usage)
  | (binary_id(ordo-host::routines) & test(a_scheduled_routine_runs_on_time_and_records_its_act))
  | (binary_id(ordo-cli::apply_wait) & test(apply_returns_only_after_the_node_serves_and_caught_up))
'''
test-group = 'timing-alone'

[[profile.default.overrides]]
filter = '''
    binary_id(ordo-exec::pool_idle)
  | binary_id(ordo-host::feed_door)
  | binary_id(ordo-host::guess_limits)
  | binary_id(ordo-host::marketing_site_app)
  | binary_id(ordo-host::provision_own)
  | binary_id(ordo-host::share_links)
  | binary_id(ordo-host::shopfront_app)
  | (binary_id(ordo-host::teamspace_app) & not test(/^(a_founder_gets_a_team|a_member_cannot_change_roles|the_admin_report_totals|a_tenant_owner_opens_the_report|a_member_adds_tasks_only|an_invited_colleague_is_shown)/))
  | binary_id(ordo-host::tenant_forward)
  | binary_id(ordo-host::upgrade_continuity)
'''
test-group = 'serial-in-file'

# notes_app's own in-process limit (`AT_ONCE`) does not reach across
# nextest's processes; this group does. Its `connections_*` tests need the
# server to themselves, which no group can give: scripts/ci-test-shard.sh
# runs them after the rest, one at a time. The thirty-people sign-up among
# them is a load test and runs in its `perf` mode only.
#
# The tests on the run's shared instance (`Deployment::on_shared`, owner
# ruling 2026-11-02, ask 6) boot nothing of their own, so they are in no
# group: teamspace's six above, and notes' below. The first of them to
# start boots the instance (tests/shared_instance/mod.rs).
[[profile.default.overrides]]
filter = '''
    binary_id(ordo-host::notes_app)
  & not test(/^(the_page_keeps_notes_on_the_device|closing_a_share_window|notes_are_listed_newest_first|concurrent_share_peeks|the_door_keeps_answering|notes_tagged_lists_only|the_served_door_mounts)/)
'''
test-group = 'notes-app'

[[profile.default.overrides]]
filter = '''
    package(ordo-conformance)
  | binary_id(ordo-playground::server)
  | binary_id(ordo-host::take_param)
'''
test-group = 'seeded-once'

# CI's profile, chosen with NEXTEST_PROFILE=ci. Every test runs whatever
# fails, so one failure cannot hide the rest of the suite. A failing test's
# output is printed when it fails and again at the end.
#
# At most 4 tests at once in a shard, whatever the runner's core count.
# At 8, three full runs on 2026-11-01 and 02 each failed 2 to 4 tests on
# timing: a pool took 8.6 s to drop connections it drops in 1 s, and a
# supervisor's first leadership dial missed its tick (run 41368713492).
# Five shards share one node. Raise it only with a run that stays green.
[profile.ci]
test-threads = 4
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
