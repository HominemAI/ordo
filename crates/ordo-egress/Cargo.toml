[package]
name = "ordo-egress"
edition.workspace = true
version.workspace = true
license.workspace = true

# The dependency list is a **security control**, not a convenience, and the
# test `tests/holds_nothing.rs` asserts it. §7b's fifth pin says egress runs
# under an identity with "no instance-credential access and no `KeyProvider`
# reachability". In one process that sentence is unenforceable as prose; as a
# dependency edge it is checkable. So this crate depends on **no** `ordo-*`
# crate: not `ordo-crypto` (which owns `KeyProvider`), not `ordo-exec` (which
# owns the pool and therefore the database credentials), not `ordo-host`.
# There is nothing here to steal because there is nothing here to reach.
#
# Adding an `ordo-*` path dependency to this file is the change that quietly
# repeals the pin, which is why the assertion is a test and not a comment.
[dependencies]
# TLS. rustls speaks TLS 1.2 and 1.3 **and nothing older** — it has no code
# for SSLv3/TLS 1.0/1.1 — so §7b's "TLS 1.2 floor" is a property of the
# library rather than a setting this crate has to remember to apply. `ring`
# rather than `aws-lc-rs` because `ed25519-dalek`'s tree already pulls a
# comparable amount and `ring` needs no CMake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# The root store. A deployment may override it (`TlsRoots::custom`), which is
# how a self-hosted cluster with a private CA points a sink at its own
# receiver without anybody reaching for an `insecure` flag that does not exist.
webpki-roots = "0.26"
# `X-Ordo-Signature`. HMAC-SHA256 is the whole cryptographic surface of this
# crate: there is deliberately no signing key here, only a per-sink shared
# secret, and the reasoning is in `sign.rs`.
hmac = "0.12"
sha2 = "0.10"
# Sockets, timeouts. `net` is what gives us `lookup_host`; `io-util` the
# `AsyncWriteExt`/`AsyncReadExt` the hand-written HTTP/1.1 writer uses.
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "macros"] }
# `FnFetch` and `SecretSource` are object-safe async traits: the function
# runtime holds an `Arc<dyn FnFetch>` and the host implements
# `SecretSource` over its sealed store. A macro with no runtime and no I/O,
# the same one `ordo-api` and `ordo-exec` use for their async traits.
async-trait = "0.1.92"

[dev-dependencies]
ordo-egress = { path = ".", features = ["test-pin"] }
tokio = { version = "1", features = ["io-util", "net", "time", "rt-multi-thread", "macros", "sync"] }
# The integration suite runs a real TLS listener, so it needs the server half
# of the same stack the client uses. A hand-rolled fake would prove the client
# against a fiction; the pins are about what a real handshake does.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true

[features]
# Mints a `PinnedDestination` without resolving — so the integration suite can
# aim a delivery at a loopback listener, which the deny list correctly refuses
# to resolve to. Off by default and never enabled by a deployment build; the
# whole point of the pin is that there is no other constructor.
test-pin = []
