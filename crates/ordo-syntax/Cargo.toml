[package]
name = "ordo-syntax"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
unicode-normalization = "0.1.25"

[dev-dependencies]
# Only the editor-grammar parity test reads JSON. A dev-dependency keeps this
# crate a leaf with one runtime dependency, which is the property that lets
# the grammar's checker live next to the lexer it checks.
serde_json = "1"
