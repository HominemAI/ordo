name: Identity service end-to-end

# The identity service's page in a real browser with a virtual passkey,
# wired as the console e2e is (console-e2e.yml): a throwaway service
# (crates/ordo-identity-service/e2e/stack.sh) on CI's Postgres service
# container, and Playwright flows against it.
#
# The upgrade case from a console that predates the identity service was
# retired 2026-10-31 (owner): that console exists only in the private
# history repository.
#
# When this runs (owner ruling, 2026-11-01), as ci.yml says in full:
#
# - A push to `bleeding` runs it when the change reaches it:
#   ordo-identity-service or a crate it builds on (scripts/ci-affected.mjs).
#   A run it does not reach says "Not reached by this change" and passes.
# - A pull request to `main`, the nightly run on `main` (09:00 UTC) and a
#   manual run run everything. So does a push whose commits carry the
#   trailer line `ci: full`.

on:
  push:
    branches: [bleeding]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: '1'

# Runs on `main` (the nightly one) are never cancelled.
concurrency:
  group: identity-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes (identity e2e)
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, ordo-k8s]
    timeout-minutes: 10
    outputs:
      reached: ${{ steps.affected.outputs.identity_e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: github.event_name == 'push'
      - name: What this change reaches
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/ci-affected.mjs

  throwaway:
    name: identity e2e
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, ordo-k8s]
    timeout-minutes: 30

    services:
      postgres:
        # An empty image skips the service when the change does not reach this.
        image: ${{ needs.changes.outputs.reached == 'true' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: ordo
          POSTGRES_PASSWORD: ordo
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ordo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REACHED: ${{ needs.changes.outputs.reached }}
      CI: '1'
      ORDO_PG_HOST: localhost
      ORDO_PG_PORT: '5432'
      ORDO_PG_USER: ordo
      ORDO_PG_PASSWORD: ordo
      ORDO_PSQL: psql

    steps:
      - name: Not reached by this change
        if: env.REACHED != 'true'
        run: echo "Not reached by this change (scripts/ci-affected.mjs). Nothing ran." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.REACHED == 'true'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: env.REACHED == 'true'

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.REACHED == 'true'
        with:
          shared-key: e2e-identity
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.REACHED == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crates/ordo-identity-service/e2e/package-lock.json

      - name: Install psql
        if: env.REACHED == 'true'
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Postgres without durable commits (CI only)
        if: env.REACHED == 'true'
        run: bash scripts/ci-pg-fast-commits.sh

      - name: Build ordo-identity-service
        if: env.REACHED == 'true'
        run: cargo build -p ordo-identity-service

      - name: Install and typecheck the tests
        if: env.REACHED == 'true'
        working-directory: crates/ordo-identity-service/e2e
        run: npm ci && npm run typecheck

      # The browsers are kept between runs: their download ran past the
      # job's limit on 2026-10-31. --with-deps still installs the system
      # libraries, and skips a browser it finds here.
      - name: Keep the browsers
        if: env.REACHED == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('crates/ordo-identity-service/e2e/package-lock.json') }}

      - name: Install Chromium
        if: env.REACHED == 'true'
        working-directory: crates/ordo-identity-service/e2e
        run: npx playwright install --with-deps chromium

      # Playwright starts the service (stack.sh) and stops it at the end.
      - name: Run the use cases
        if: env.REACHED == 'true'
        working-directory: crates/ordo-identity-service/e2e
        run: npx playwright test

      - name: Upload the traces and service log
        if: ${{ env.REACHED == 'true' && (failure()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identity-e2e-report
          retention-days: 14
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            crates/ordo-identity-service/e2e/test-results/
            crates/ordo-identity-service/e2e/.stack/*.log
