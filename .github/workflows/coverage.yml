name: Coverage

# Run by hand: which lines the Rust suite never executes. The same suite,
# database and runner as CI's `test` job, built with coverage instrumentation.
# It answers "what has no test", so a red test here still writes the report.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  pull-requests: read

jobs:
  unit:
    name: coverage (unit)
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.ORDO_RUNNERS == 'k8s' && fromJSON('["self-hosted","ordo-k8s"]') || 'ubuntu-latest' }}
    timeout-minutes: ${{ vars.ORDO_RUNNERS == 'k8s' && 90 || 180 }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ordo
          POSTGRES_PASSWORD: ordo
          POSTGRES_DB: ordo_conformance
        ports: ['5432:5432']
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U ordo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ORDO_PG_HOST: localhost
      ORDO_PG_PORT: '5432'
      ORDO_PG_USER: ordo
      ORDO_PG_DB: ordo_conformance
      ORDO_PSQL: psql
      PGPASSWORD: ordo
      ORDO_PG_PASSWORD: ordo

    steps:
      - name: Free disk space (hosted runners)
        if: ${{ vars.ORDO_RUNNERS != 'k8s' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@c3076e6fa5aeb9a93daf1bd8eff73345250a8a9c # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - name: Install psql client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Runner disk noise only; the product fix is the store pool's size
      # and wait (board task `store-pool-held-blocks-signin`). See the script.
      - name: Postgres without durable commits (CI only)
        run: bash scripts/ci-pg-fast-commits.sh

      - name: Test with coverage
        run: cargo llvm-cov --workspace --no-fail-fast --no-report

      - name: Report
        if: always()
        run: |
          mkdir -p coverage-out
          cargo llvm-cov report --summary-only > coverage-summary.txt
          cargo llvm-cov report --lcov --output-path coverage-out/lcov-unit.info
          tail -n 1 coverage-summary.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lcov-unit
          path: coverage-out/lcov-unit.info
          if-no-files-found: error

  notes:
    uses: ./.github/workflows/e2e.yml
    with:
      coverage: true

  federation:
    uses: ./.github/workflows/federation-e2e.yml
    with:
      coverage: true

  # S1 adds examples-e2e.yml and its job here when the first new suite exists.
  ratchet:
    name: coverage ratchet
    needs: [unit, notes, federation]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Test coverage accounting
        run: node --test scripts/coverage-crates.test.mjs scripts/e2e-coverage.test.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lcov-*
          path: coverage-out
          merge-multiple: true
      - name: Measure and check the floors
        run: |
          # Missing inputs must fail, rather than silently lower the denominator.
          for suite in unit notes federation; do
            test -s "coverage-out/lcov-$suite.info"
          done
          node scripts/coverage-crates.mjs --label unit --out coverage-out/unit.json coverage-out/lcov-unit.info > coverage-out/unit.md
          node scripts/coverage-crates.mjs --label examples --out coverage-out/examples.json coverage-out/lcov-notes.info coverage-out/lcov-federation.info > coverage-out/examples.md
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pct = label => JSON.parse(readFileSync(`coverage-out/${label}.json`)).total.percent.toFixed(2);
            console.log(`Unit ${pct("unit")}%. Examples ${pct("examples")}%.\n`);
          ' >> "$GITHUB_STEP_SUMMARY"
          cat coverage-out/unit.md coverage-out/examples.md >> "$GITHUB_STEP_SUMMARY"
          status=0
          node scripts/coverage-crates.mjs --label unit --check coverage/floor.json coverage-out/lcov-unit.info || status=1
          node scripts/coverage-crates.mjs --label examples --check coverage/floor.json coverage-out/lcov-notes.info coverage-out/lcov-federation.info || status=1
          exit "$status"
      - name: Every coverage suite must pass
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            for (const [name, job] of Object.entries(JSON.parse(process.env.RESULTS))) {
              if (job.result !== "success") { console.error(`${name}: ${job.result}`); process.exitCode = 1; }
            }
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-per-crate
          path: |
            coverage-out/*.json
            coverage-out/*.md
          if-no-files-found: error
