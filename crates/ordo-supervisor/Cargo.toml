[package]
name = "ordo-supervisor"
edition.workspace = true
version.workspace = true
license.workspace = true

# The one image's entrypoint (`docs/plan-identity-service.md` 3, step 7): a
# small parent that runs the identity service, the console and the
# deployment as siblings, each as its own unix user. It was the console's
# `supervisor/` module; the console no longer runs the thing it manages.

[[bin]]
name = "ordo-supervisor"
path = "src/main.rs"

# A stand-in for each child that the tests spawn: it can start healthy,
# crash, hang or fail readiness, as its settings say. Test only; the image
# builds `--bin ordo-supervisor` alone.
[[bin]]
name = "ordo-supervisor-fake-child"
path = "src/bin/fake_child.rs"
test = false
doc = false

[dependencies]
# The one list of settings that hold a secret, shared with `ordo-host`.
ordo-env = { path = "../ordo-env" }
# The sealing key file and sealed values, shared with the console and the
# identity service (`plan-identity-service.md` 2.1).
ordo-identity = { path = "../ordo-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }

# Signals, the parent-death signal, the privilege drop and file ownership,
# through safe wrappers: the workspace forbids `unsafe`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process", "thread"] }

[lints]
workspace = true
